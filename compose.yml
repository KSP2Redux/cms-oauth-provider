services:
  cms-oauth:
    container_name: cms-oauth
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      OAUTH_CLIENT_ID: ${DECAP_GITHUB_CLIENT_ID:?DECAP_GITHUB_CLIENT_ID is required}
      OAUTH_CLIENT_SECRET: ${DECAP_GITHUB_CLIENT_SECRET:?DECAP_GITHUB_CLIENT_SECRET is required}
      OAUTH_STATE_SECRET: ${DECAP_OAUTH_STATE_SECRET:?DECAP_OAUTH_STATE_SECRET is required}
      REDIRECT_URL: ${DECAP_REDIRECT_URL:?DECAP_REDIRECT_URL is required}
      ORIGINS: ${DECAP_ALLOWED_ORIGINS:?DECAP_ALLOWED_ORIGINS is required}
      GITHUB_ALLOWED_ORGANIZATION: ${DECAP_GITHUB_ALLOWED_ORGANIZATION:?DECAP_GITHUB_ALLOWED_ORGANIZATION is required}
      SCOPES: public_repo,read:user,read:org
    networks:
      - caddy_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

networks:
  caddy_net:
    external: true
